<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concrete crack detector</title>
<style>
  :root { --bg:#ffffff; --fg:#1b1b1f; --muted:#62626c; --card:#f4f4f6; --border:#d8d8de; --accent:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --fg:#ececf1; --muted:#a0a0ab; --card:#22222a; --border:#34343e; --accent:#ef5350; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  form { display:flex; flex-wrap:wrap; gap:12px; align-items:end; background:var(--card);
         border:1px solid var(--border); border-radius:10px; padding:16px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--muted); }
  input[type=file], select { font:inherit; color:var(--fg); background:var(--bg);
         border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
  button { font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0;
           border-radius:6px; padding:9px 18px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #status { margin:16px 0 0; color:var(--muted); min-height:1.5em; }
  #result { display:none; margin-top:8px; }
  #result img { max-width:100%; height:auto; border-radius:8px; border:1px solid var(--border); }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 14px; }
  .stat b { display:block; font-size:1.2rem; }
  .stat span { font-size:.8rem; color:var(--muted); }
  ul#notes { color:var(--muted); font-size:.9rem; padding-left:20px; }
  .disclaimer { margin-top:28px; font-size:.85rem; color:var(--muted);
                border-top:1px solid var(--border); padding-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Concrete crack detector</h1>
  <p class="sub">Upload a close-up photo of a concrete surface. It is cut into 256&times;256 px tiles and each tile is classified as cracked or not.</p>

  <form id="form">
    <label>Photo (JPEG or PNG, up to 15 MB)
      <input id="file" type="file" accept="image/*" required>
    </label>
    <label>Operating point
      <select id="mode">
        <option value="balanced">Balanced (best F1)</option>
        <option value="high_recall">High recall (more false alarms)</option>
      </select>
    </label>
    <button id="go" type="submit">Analyse</button>
  </form>

  <p id="status" role="status"></p>

  <section id="result">
    <img id="overlay" alt="Photo with flagged tiles outlined in red">
    <div class="stats">
      <div class="stat"><b id="s-flagged">-</b><span>tiles flagged</span></div>
      <div class="stat"><b id="s-total">-</b><span>tiles analysed</span></div>
      <div class="stat"><b id="s-max">-</b><span>highest tile probability</span></div>
    </div>
    <ul id="notes"></ul>
  </section>

  <p class="disclaimer" id="disclaimer"></p>
</main>

<script>
const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const goBtn = document.getElementById('go');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('file').files[0];
  if (!file) return;
  const mode = document.getElementById('mode').value;

  goBtn.disabled = true;
  statusEl.textContent = 'Analysing, this can take a few seconds on CPU...';
  document.getElementById('result').style.display = 'none';

  const body = new FormData();
  body.append('file', file);
  try {
    const resp = await fetch(`/predict?mode=${encodeURIComponent(mode)}&overlay=true`, { method: 'POST', body });
    const data = await resp.json();
    if (!resp.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Request failed');

    document.getElementById('overlay').src = data.overlay;
    document.getElementById('s-flagged').textContent = data.tiles_flagged;
    document.getElementById('s-total').textContent = data.tiles_total;
    document.getElementById('s-max').textContent = data.max_probability.toFixed(2);

    const notes = document.getElementById('notes');
    notes.replaceChildren(...data.notes.map(n => { const li = document.createElement('li'); li.textContent = n; return li; }));
    document.getElementById('disclaimer').textContent = data.disclaimer;
    document.getElementById('result').style.display = 'block';
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    goBtn.disabled = false;
  }
});
</script>
</body>
</html>
